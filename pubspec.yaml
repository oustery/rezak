name: rezak
description: "Мобильный клиент для поиска встраиваемых плееров через API iframe.cloud и скачивания HLS/DASH-потоков вместе с аудиодорожкой."
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP-слой: API плееров + разбор master-плейлиста
  dio: ^5.7.0

  # WebView со сниффером сетевых запросов
  flutter_inappwebview: ^6.2.0-beta.3

  # ffmpeg/ffprobe на устройстве (поддерживаемый форк вышедшего на пенсию
  # ffmpeg-kit). Вариант https = минимальная сборка + gnutls (TLS для
  # https-плейлистов): приложению нужен только ремюкс (-c copy) и ffprobe,
  # GPL-кодеки (x264/x265) и тяжёлые внешние библиотеки не используются —
  # это снимает ~30% размера APK относительно базового (full-gpl) пакета.
  ffmpeg_kit_flutter_new_https: ^2.6.8

  # Пути и шаринг готового файла
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  material_ui: ^1.11.0

  # Компоненты Forui: статус-бейджи и кнопка отмены в списке загрузок
  forui: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
