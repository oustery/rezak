name: Release APK (release + debug, arm64 + armv7)

# После компиляции автоматически выпускаем ДВА варианта на каждую
# архитектуру — всего четыре APK:
#   * release — выделенная release-подпись: ключ из секретов репозитория
#     (KEYSTORE_*) либо сгенерированный keytool'ом на время сборки;
#   * debug   — стандартный Android debug-ключ (для тестов).
#
# Как это работает:
#   * push в master/dev         → тесты + сборка, 4 APK в артефакты workflow
#   * тег v* (например v1.1.0)  → тесты + сборка, APK сразу в GitHub Release,
#     versionName берётся из тега (v1.1.0 → 1.1.0)
#   * pull_request              → тесты, анализатор и сборка всех вариантов
#   * workflow_dispatch         → ручной запуск, можно задать версию

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Версия (versionName), например 1.0.1'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '17'

jobs:
  # ------------------------------------------------------------------
  # 1. Качество кода: анализатор + все тесты (юнит и widget)
  # ------------------------------------------------------------------
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Установка зависимостей
        run: flutter pub get

      - name: Анализатор
        # Информационные предупреждения не валят сборку, ошибки — валят.
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded

  # ------------------------------------------------------------------
  # 2. Матрица сборки: одна задача на каждую архитектуру
  # ------------------------------------------------------------------
  build-apk:
    name: APK ${{ matrix.abi }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target-platform: android-arm64
          - abi: armeabi-v7a
            target-platform: android-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # Версия: из тега (v1.1.0 → 1.1.0), из input при ручном запуске,
      # иначе дефолт. Раньше сборка на тегах всегда шла с --build-name 1.0.0.
      - name: Определение версии
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.build_name }}" ]; then
            VER="${{ inputs.build_name }}"
          else
            VER="1.0.0"
          fi
          echo "Версия сборки: $VER"
          echo "BUILD_VERSION=$VER" >> "$GITHUB_ENV"

      # Release-подпись. Секреты недоступны в `if` шага из его собственного
      # env-контекста, поэтому ветвление делаем внутри скрипта.
      - name: Release-подпись (из секретов или сгенерированная)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "SIGN_MODE=secrets" >> "$GITHUB_ENV"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf '%s\n' \
              "storeFile=upload-keystore.jks" \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "keyPassword=$KEY_PASSWORD" \
              > android/key.properties
            echo "Release-подпись: keystore из секретов репозитория"
          else
            echo "SIGN_MODE=generated" >> "$GITHUB_ENV"
            STORE_PASS=$(openssl rand -hex 24)
            KEY_PASS=$(openssl rand -hex 24)
            keytool -genkeypair -v \
              -keystore android/app/rezak-release.jks \
              -alias rezak-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Rezak Release, OU=Oustery, O=Oustery, C=RU"
            printf '%s\n' \
              "storeFile=rezak-release.jks" \
              "storePassword=$STORE_PASS" \
              "keyAlias=rezak-release" \
              "keyPassword=$KEY_PASS" \
              > android/key.properties
            echo "Release-подпись: сгенерированный release-ключ (живёт только в рамках сборки)"
          fi

      # Debug-вариант подписывается стандартным Android debug-ключом
      # (тот же, что Flutter/Gradle генерируют локально при первой сборке).
      - name: Debug-подпись (стандартный Android debug-ключ)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Версии инструментов
        run: |
          java -version
          flutter --version
          grep -E 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties || true
          grep -E 'com.android.application' android/settings.gradle.kts || true

      - name: Сборка release APK (${{ matrix.abi }})
        run: |
          flutter build apk \
            --release \
            --target-platform ${{ matrix.target-platform }} \
            --build-name ${{ env.BUILD_VERSION }} \
            --build-number ${{ github.run_number }}

      - name: Сборка debug APK (${{ matrix.abi }})
        run: |
          flutter build apk \
            --debug \
            --target-platform ${{ matrix.target-platform }} \
            --build-name ${{ env.BUILD_VERSION }} \
            --build-number ${{ github.run_number }}

      # Переименовываем оба APK под ABI и проверяем, что внутри каждого
      # ровно одна архитектура — именно ожидаемая.
      - name: Переименование и проверка ABI (release + debug)
        run: |
          set -euo pipefail
          mkdir -p dist
          ABI="${{ matrix.abi }}"
          VER="${{ env.BUILD_VERSION }}"

          for kind in release debug; do
            APK="build/app/outputs/flutter-apk/app-$kind.apk"
            [ -f "$APK" ] || { echo "Не найден $APK" >&2; exit 1; }
            echo "=== $kind: $APK"
            ABIS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | cut -d/ -f2 | sort -u)
            echo "$ABIS"
            if [ "$(echo "$ABIS" | wc -l)" -ne 1 ]; then
              echo "Ожидалась ровно одна архитектура, получили: $ABIS" >&2
              exit 1
            fi
            if [ "$ABIS" != "$ABI" ]; then
              echo "Ожидалась $ABI, а в APK: $ABIS" >&2
              exit 1
            fi
            if [ "$kind" = "release" ]; then
              cp "$APK" "dist/rezak-$ABI-v$VER.apk"
            else
              cp "$APK" "dist/rezak-$ABI-v$VER-debug.apk"
            fi
          done
          ls -la dist

      # Контроль подписей: release-APK обязан быть подписан НЕ debug-ключом.
      - name: Проверка подписей
        run: |
          set -euo pipefail
          ABI="${{ matrix.abi }}"
          VER="${{ env.BUILD_VERSION }}"
          REL="dist/rezak-$ABI-v$VER.apk"
          DBG="dist/rezak-$ABI-v$VER-debug.apk"
          echo "=== Release APK (режим: ${{ env.SIGN_MODE }}):"
          keytool -printcert -jarfile "$REL" | head -3
          echo "=== Debug APK:"
          keytool -printcert -jarfile "$DBG" | head -3
          if keytool -printcert -jarfile "$REL" | grep -q 'CN=Android Debug'; then
            echo "Release APK подписан debug-ключом — это ошибка конфигурации" >&2
            exit 1
          fi

      # На тег — сразу прикрепляем APK к релизу (не тратит квоту артефактов).
      - name: Прикрепить к GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rezak ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # На обычный push — артефакт workflow.
      # continue-on-error: исчерпанная квота хранилища не должна «валить» сборку,
      # сами APK при этом успешно собраны и проверены.
      - name: Загрузка артефакта
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rezak-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
